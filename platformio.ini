; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; pioarduino, vastgezet op een exacte versie zodat de build reproduceerbaar is
; en niet ongemerkt een nieuw platform/framework gaat downloaden
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = adafruit_feather_esp32s3_nopsram
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Board-profiel flasht anders tinyuf2.bin op 0x2d0000, midden in onze ota_1
board_upload.arduino.flash_extra_images =
build_flags = 
lib_deps = 
	fastled/FastLED@3.10.3
	esp32async/AsyncTCP@3.4.10
	esp32async/ESPAsyncWebServer@3.9.4
